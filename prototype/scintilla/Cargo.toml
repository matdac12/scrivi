[package]
name = "scrivi-proto"
version = "0.0.0"
edition = "2021"
publish = false
description = "Throwaway spike: can Scintilla carry scrivi's Source view?"

# Standalone crate, not part of any workspace.
[workspace]

[dependencies]
windows-core = "=0.62.2"
pulldown-cmark = { version = "0.13", default-features = false }

[dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
cc = { version = "1", features = ["parallel"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
